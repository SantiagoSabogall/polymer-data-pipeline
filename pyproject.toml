[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-data-pipeline"
version = "1.0.0"
description = "Scientific literature aggregation pipeline for polymer/packaging research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Santiago Sabogal", email = "ssabogal@unal.edu.co" },
]
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "lxml>=4.9",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.scripts]
polymer-pipeline = "polymer_pipeline.pipeline:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
